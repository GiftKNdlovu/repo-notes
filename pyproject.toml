[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "repo-notes"
version = "0.3.0"
description = "Generate useful notes for any code repository from one command"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "Gift Ndlovu" },
]
keywords = [
    "repository",
    "code-analysis",
    "developer-tools",
    "cli",
    "ai-agents",
    "documentation",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Documentation",
    "Topic :: Software Development",
    "Topic :: Software Development :: Documentation",
    "Topic :: Utilities",
]
dependencies = [
    "click>=8.0",
    "pyyaml>=6.0",
    "pathspec>=0.11",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-cov>=4.0", "ruff>=0.1.0"]

[project.scripts]
repo-notes = "repo_notes.__main__:main"

[project.urls]
Homepage = "https://github.com/GiftKNdlovu/repo-notes"
Repository = "https://github.com/GiftKNdlovu/repo-notes"
Issues = "https://github.com/GiftKNdlovu/repo-notes/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
